<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book a Ride - RideEase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📍 Book a Ride</h1>
        <p class="subtitle">Where would you like to go?</p>

        <!-- ===== Book Ride Form ===== -->
        <form id="bookRideForm">
            <div class="form-group">
                <label>Pickup Location</label>
                <input type="text" id="pickupLocation" placeholder="e.g. Nashik Road" required>
            </div>

            <div class="form-group">
                <label>Drop Location</label>
                <input type="text" id="dropLocation" placeholder="e.g. College Road" required>
            </div>

            <div class="form-group">
                <label>Distance (in KM)</label>
                <input type="number" id="distance" placeholder="e.g. 8" step="0.1" required>
            </div>

            <button type="submit">Book Ride</button>
        </form>

        <div id="responseMessage"></div>

        
        <div id="activeRideCard"></div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script src="script.js"></script>
    <script src="book-ride.js"></script>
</body>
</html>
